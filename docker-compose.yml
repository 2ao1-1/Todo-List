version: "3.8"

services:
  todolist:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3050:3050
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

networks:
  default:
    driver: bridge
