name: CI/CD Pipeline

on:
  push:
    branches:
      - version-2

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todolist:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todolist:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/todolist:latest
            docker stop mytodoapp || true
            docker rm mytodoapp || true
            docker run -d \
              --restart unless-stopped \
              --env-file /root/Ahmed-Omran/todolistapp/Todo-List/.env \
              --name mytodoapp \
              -p 3040:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/todolist:latest
